services:
  - type: web
    name: aeroguard-ai-site-inspector
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -e ".[test]"
    startCommand: gunicorn aeroguard.web:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALERT_MIN_SEVERITY
        value: high
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: MAX_IMAGE_MB
        value: "15"
      - key: DATA_DIR
        value: data
      - key: REPORT_DIR
        value: reports
